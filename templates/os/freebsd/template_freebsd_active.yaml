zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: d14a339b90b24ea1a29871d65f32dbbf
      template: 'FreeBSD by Zabbix agent active'
      name: 'FreeBSD by Zabbix agent active'
      description: |
        This is an unofficial active version of an official FreeBSD template. 
        It requires Zabbix agent 7.4 or newer.
        
        Notes on filesystem (FS) discovery:
          - The ext4/3/2 FS reserves space for privileged usage, typically set at 5% by default.
          - BTRFS allocates a default of 10% of the volume for its own needs.
          - To mitigate potential disasters, FS usage triggers are based on the maximum available space.
            - Utilization formula: 'pused = 100 - 100 * (available / total - free + available)'
          - The FS utilization chart, derived from graph prototypes, reflects FS reserved space as the difference between used and available space from the total volume.
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback/
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: dc4cfb26eb994fbabd9d94d394b56f36
          name: 'Host name of Zabbix agent running'
          type: ZABBIX_ACTIVE
          key: agent.hostname
          delay: 1h
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 3ad928a6bd1444de8a506cbcb2315a73
          name: 'Zabbix agent ping'
          type: ZABBIX_ACTIVE
          key: agent.ping
          description: 'The agent always returns "1" for this item. May be used in combination with `nodata()` for the availability check.'
          valuemap:
            name: 'Zabbix agent ping status'
          tags:
            - tag: component
              value: system
        - uuid: bf9a5c1aa641436b8aa464f29e81de47
          name: 'Version of Zabbix agent running'
          type: ZABBIX_ACTIVE
          key: agent.version
          delay: 1h
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: application
        - uuid: 0a3b568ac9ba42d9b11ee1e0a2dd7282
          name: 'Maximum number of opened files'
          type: ZABBIX_ACTIVE
          key: kernel.maxfiles
          delay: 1h
          description: 'May be increased by using the `sysctl` utility or modifying the file `/etc/sysctl.conf`.'
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: 9205bcb9e7b64be78f4f6b585f041f89
              expression: 'last(/FreeBSD by Zabbix agent active/kernel.maxfiles)<1024'
              name: 'FreeBSD: Configured max number of opened files is too low on {HOST.NAME}'
              priority: INFO
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: performance
        - uuid: edf2032176bb47be8360d41ec6d0b9bb
          name: 'Maximum number of processes'
          type: ZABBIX_ACTIVE
          key: kernel.maxproc
          delay: 1h
          description: 'May be increased by using the `sysctl` utility or modifying the file `/etc/sysctl.conf`.'
          tags:
            - tag: component
              value: os
            - tag: component
              value: processes
          triggers:
            - uuid: 2d3190d96e4f4391ab5d7637b99e4f1d
              expression: 'last(/FreeBSD by Zabbix agent active/kernel.maxproc)<256'
              name: 'FreeBSD: Configured max number of processes is too low on {HOST.NAME}'
              priority: INFO
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: performance
        - uuid: 01f6201fa29f4f139e5fba53806ff451
          name: 'Number of running processes'
          type: ZABBIX_ACTIVE
          key: 'proc.num[,,run]'
          description: 'Number of processes in a running state.'
          tags:
            - tag: component
              value: os
            - tag: component
              value: processes
          triggers:
            - uuid: 728e414112de4f14bc7b61f6d1f1d7de
              expression: 'avg(/FreeBSD by Zabbix agent active/proc.num[,,run],5m)>30'
              name: 'FreeBSD: Too many processes running on {HOST.NAME}'
              priority: WARNING
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: performance
        - uuid: 85b7bf1e8fb84a76bccfd58a49504fa5
          name: 'Number of processes'
          type: ZABBIX_ACTIVE
          key: 'proc.num[]'
          description: 'Total number of processes in any state.'
          tags:
            - tag: component
              value: os
            - tag: component
              value: processes
          triggers:
            - uuid: 9bac25c621a143759beb9911e1703700
              expression: 'avg(/FreeBSD by Zabbix agent active/proc.num[],5m)>300'
              name: 'FreeBSD: Too many processes on {HOST.NAME}'
              priority: WARNING
              tags:
                - tag: scope
                  value: notice
                - tag: scope
