        - uuid: 476e643e89d54868b9d32e43765f8d4b
          name: 'Host boot time'
          type: ZABBIX_ACTIVE
          key: system.boottime
          delay: 10m
          units: unixtime
          tags:
            - tag: component
              value: os
        - uuid: d65aa6b55a00496d94b4f1ec8c457fae
          name: 'Interrupts per second'
          type: ZABBIX_ACTIVE
          key: system.cpu.intr
          units: ips
          description: 'Number of interrupts processed.'
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: cpu
        - uuid: 1659fc41c4db44c1bd3ed14089ec1131
          name: 'Load average (1m avg)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[all,avg1]'
          value_type: FLOAT
